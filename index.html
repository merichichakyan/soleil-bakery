<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Soleil Bakery — Sun-kissed bakes and golden mornings ☀️🥐</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-400-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-700-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-400-italic.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-700-italic.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/cormorant-garamond@latest/latin-400-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/cormorant-garamond@latest/latin-500-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/cormorant-garamond@latest/latin-400-italic.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-500-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css" rel="stylesheet">
<style>
  :root{
    --cream:#F5E8D3;
    --cream-soft:#FBF4E8;
    --milk:#FFFBF5;
    --chocolate:#3E2A1F;
    --chocolate-soft:#6B4A36;
    --gold:#C9A063;
    --gold-soft:#E3C798;
    --gold-deep:#A8844A;
    --green:#6B8E6B;
    --green-soft:#A8C4A8;
    --ink:#2A1F17;
    --muted:#8A7A6B;
    --shadow: 0 10px 40px rgba(62,42,31,.08);
    --shadow-lg: 0 30px 80px rgba(62,42,31,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',sans-serif;
    background:var(--milk);
    color:var(--ink);
    line-height:1.6;
    overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:'Playfair Display',serif;font-weight:700;color:var(--chocolate);letter-spacing:-.01em}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .container{max-width:1240px;margin:0 auto;padding:0 28px}

  /* NAV */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    backdrop-filter:blur(14px);
    background:rgba(255,251,245,.75);
    border-bottom:1px solid rgba(62,42,31,.06);
    transition:all .3s ease;
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;max-width:1240px;margin:0 auto}
  .logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--chocolate);display:flex;align-items:center;gap:8px}
  .logo span{color:var(--gold)}
  .nav-links{display:flex;gap:30px;align-items:center}
  .nav-links a{font-size:14px;font-weight:500;color:var(--chocolate-soft);transition:color .2s;position:relative}
  .nav-links a:hover{color:var(--chocolate)}
  .nav-links a::after{content:"";position:absolute;bottom:-6px;left:0;width:0;height:1px;background:var(--gold);transition:width .3s}
  .nav-links a:hover::after{width:100%}
  .lang-toggle{
    display:inline-flex;align-items:center;gap:0;
    padding:4px;border-radius:999px;
    background:rgba(62,42,31,.05);
    border:1px solid rgba(62,42,31,.08);
    font-size:12px;font-weight:600;
  }
  .lang-btn{
    padding:6px 12px;border-radius:999px;
    background:transparent;border:none;cursor:pointer;
    color:var(--chocolate-soft);font-family:inherit;font-weight:600;
    transition:all .25s;letter-spacing:.05em;
  }
  .lang-btn.active{background:var(--chocolate);color:var(--milk)}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:12px 24px;border-radius:999px;
    background:var(--chocolate);color:var(--milk);
    font-size:14px;font-weight:500;
    transition:all .3s ease;border:none;cursor:pointer;
  }
  .btn:hover{background:var(--gold);transform:translateY(-2px);box-shadow:0 10px 25px rgba(201,160,99,.3)}
  .btn-ghost{background:transparent;color:var(--chocolate);border:1px solid var(--chocolate)}
  .btn-ghost:hover{background:var(--chocolate);color:var(--milk)}
  .menu-toggle{display:none;background:none;border:none;cursor:pointer;color:var(--chocolate)}

  /* HERO — PREMIUM EDITORIAL */
  .hero{
    min-height:100vh;
    padding:130px 0 80px;
    position:relative;
    background:
      radial-gradient(ellipse at 85% 15%, rgba(201,160,99,.22), transparent 55%),
      radial-gradient(ellipse at 5% 85%, rgba(107,142,107,.12), transparent 55%),
      linear-gradient(180deg, var(--cream-soft) 0%, #F3E5CE 100%);
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(62,42,31,.035) 1px, transparent 0);
    background-size: 36px 36px;
    pointer-events:none;
  }
  .hero::after{
    content:"";position:absolute;
    bottom:0;left:0;right:0;height:120px;
    background:linear-gradient(180deg,transparent,var(--milk));
    pointer-events:none;
  }

  /* Vertical side label — editorial touch */
  .hero-side-label{
    position:absolute;
    left:28px;top:50%;transform:translateY(-50%) rotate(-90deg);
    transform-origin:left center;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:.35em;
    color:var(--chocolate-soft);
    opacity:.55;
    z-index:3;
    white-space:nowrap;
  }
  .hero-side-label::before,
  .hero-side-label::after{
    content:"";display:inline-block;
    width:30px;height:1px;background:var(--gold);
    vertical-align:middle;margin:0 14px;opacity:.6;
  }

  /* Top ornamental line */
  .hero-ornament-top{
    position:absolute;top:120px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;
    color:var(--gold);font-size:10px;letter-spacing:.5em;text-transform:uppercase;
    font-weight:500;opacity:.75;
    z-index:3;
  }
  .hero-ornament-top .line{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .hero-ornament-top .diamond{
    width:6px;height:6px;background:var(--gold);
    transform:rotate(45deg);
  }

  .hero-grid{
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap:80px;
    align-items:center;
    position:relative;
    z-index:2;
  }
  .hero-text{position:relative}

  /* Premium badge — refined monogram */
  .hero-badge{
    display:inline-flex;align-items:center;gap:14px;
    margin-bottom:36px;
  }
  .hero-badge .monogram{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold-soft) 0%,var(--gold) 60%,var(--gold-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    color:var(--milk);
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:26px;font-weight:700;
    box-shadow:
      0 0 0 4px var(--milk),
      0 0 0 5px var(--gold),
      0 12px 30px rgba(201,160,99,.35);
    position:relative;
  }
  .hero-badge .monogram::after{
    content:"";position:absolute;inset:-8px;
    border:1px dashed var(--gold);border-radius:50%;
    opacity:.4;
    animation:spin 40s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero-badge .badge-text{
    display:flex;flex-direction:column;gap:2px;
  }
  .hero-badge .badge-text .est{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:12px;
    color:var(--gold-deep);
    letter-spacing:.2em;
  }
  .hero-badge .badge-text .name{
    font-family:'Playfair Display',serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:var(--chocolate);
  }

  .hero h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(54px,7vw,100px);
    line-height:.98;
    margin-bottom:32px;
    font-weight:400;
    letter-spacing:-.025em;
  }
  .hero h1 .line1{
    display:block;
    color:var(--chocolate);
    font-style:italic;
    font-weight:400;
  }
  .hero h1 .line2{
    display:block;
    font-weight:700;
    font-style:normal;
    color:var(--chocolate);
    padding-left:60px;
    position:relative;
    margin-top:8px;
  }
  .hero h1 .line2::before{
    content:"";position:absolute;left:0;top:55%;
    width:40px;height:1px;background:var(--gold);
  }
  .hero h1 .line2 .amp{
    font-style:italic;
    font-weight:400;
    color:var(--gold-deep);
  }

  .hero-tag{
    font-family:'Cormorant Garamond',serif;
    font-size:21px;
    font-style:italic;
    color:var(--chocolate-soft);
    margin-bottom:44px;
    max-width:460px;
    line-height:1.55;
    padding-left:20px;
    border-left:1px solid var(--gold);
  }

  .hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:64px}

  .hero-stats{
    display:flex;gap:0;
    padding:28px 0;
    border-top:1px solid rgba(62,42,31,.12);
    border-bottom:1px solid rgba(62,42,31,.12);
    position:relative;
  }
  .hero-stat{
    flex:1;
    padding:0 24px;
    position:relative;
  }
  .hero-stat + .hero-stat::before{
    content:"";position:absolute;left:0;top:10%;bottom:10%;
    width:1px;background:rgba(62,42,31,.15);
  }
  .hero-stat:first-child{padding-left:0}
  .hero-stat:last-child{padding-right:0}
  .stat-num{
    font-family:'Playfair Display',serif;
    font-size:38px;color:var(--chocolate);font-weight:700;
    line-height:1;
    font-style:italic;
  }
  .stat-num .num-suffix{
    font-size:20px;color:var(--gold-deep);
    font-style:italic;
    margin-left:2px;
  }
  .stat-label{
    font-size:10px;color:var(--muted);
    margin-top:10px;letter-spacing:.25em;text-transform:uppercase;font-weight:600;
  }

  /* HERO VISUAL — EDITORIAL PREMIUM */
  .hero-visual{
    position:relative;
    height:640px;
  }

  .hero-frame{
    position:absolute;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
  }
  .hero-frame img{
    width:100%;height:100%;object-fit:cover;
    transition:transform 1.4s cubic-bezier(.2,.8,.2,1);
  }
  .hero-frame:hover img{transform:scale(1.05)}

  /* Main image — with gold corner accents */
  .hero-frame-1{
    width:62%;height:78%;
    top:0;right:0;
    z-index:2;
    border-radius:4px;
  }
  .hero-frame-1::before{
    content:"";position:absolute;inset:0;
    border:1px solid rgba(255,251,245,.3);
    z-index:2;pointer-events:none;
  }
  /* Gold corner accents */
  .hero-frame-1 .corner{
    position:absolute;width:40px;height:40px;
    border:1px solid var(--gold);
    z-index:3;pointer-events:none;
  }
  .hero-frame-1 .corner.tl{top:-8px;left:-8px;border-right:none;border-bottom:none}
  .hero-frame-1 .corner.tr{top:-8px;right:-8px;border-left:none;border-bottom:none}
  .hero-frame-1 .corner.bl{bottom:-8px;left:-8px;border-right:none;border-top:none}
  .hero-frame-1 .corner.br{bottom:-8px;right:-8px;border-left:none;border-top:none}

  /* Secondary image — framed with milk border */
  .hero-frame-2{
    width:44%;height:52%;
    bottom:0;left:0;
    z-index:3;
    border:8px solid var(--milk);
    border-radius:4px;
    box-shadow:
      0 30px 60px rgba(62,42,31,.25),
      0 0 0 1px rgba(201,160,99,.2);
  }

  /* Floating sun medallion */
  .hero-sun{
    position:absolute;
    top:30px;left:42%;
    width:84px;height:84px;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 30%, #FFE9B8 0%, var(--gold-soft) 35%, var(--gold) 70%, var(--gold-deep) 100%);
    z-index:4;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;
    box-shadow:
      0 0 0 6px var(--milk),
      0 0 0 7px var(--gold),
      0 20px 50px rgba(201,160,99,.5);
    animation:sunFloat 6s ease-in-out infinite;
  }
  @keyframes sunFloat{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%{transform:translateY(-8px) rotate(8deg)}
  }
  .hero-sun::before{
    content:"";position:absolute;inset:-18px;
    border:1px dashed var(--gold);border-radius:50%;
    opacity:.4;
    animation:spin 30s linear infinite;
  }

  /* Elegant tag card */
  .hero-tag-card{
    position:absolute;
    bottom:30px;right:-10px;
    z-index:5;
    background:var(--milk);
    padding:16px 22px;
    border-radius:100px;
    box-shadow:0 20px 50px rgba(62,42,31,.15);
    display:flex;align-items:center;gap:14px;
    border:1px solid rgba(201,160,99,.2);
  }
  .hero-tag-card .emoji{
    width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,var(--cream-soft),var(--gold-soft));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    flex-shrink:0;
  }
  .hero-tag-card .txt{font-size:11px;color:var(--muted);line-height:1.3;letter-spacing:.05em}
  .hero-tag-card .txt strong{
    display:block;color:var(--chocolate);
    font-family:'Playfair Display',serif;
    font-size:14px;font-weight:700;margin-bottom:2px;
    font-style:italic;
  }

  /* Scroll indicator */
  .scroll-indicator{
    position:absolute;
    bottom:30px;left:50%;transform:translateX(-50%);
    z-index:3;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:var(--chocolate-soft);
    opacity:.6;
  }
  .scroll-indicator .label{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
  }
  .scroll-indicator .line{
    width:1px;height:40px;
    background:linear-gradient(180deg,var(--gold),transparent);
    animation:scrollPulse 2s ease-in-out infinite;
  }
  @keyframes scrollPulse{
    0%,100%{opacity:.3;transform:scaleY(1)}
    50%{opacity:1;transform:scaleY(1.2)}
  }

  /* SECTION */
  section{padding:120px 0;position:relative}
  .section-head{text-align:center;max-width:640px;margin:0 auto 64px}
  .section-eyebrow{
    display:inline-block;font-size:11px;font-weight:600;
    letter-spacing:.25em;text-transform:uppercase;color:var(--gold);
    margin-bottom:16px;
  }
  .section-head h2{font-size:clamp(36px,4.5vw,56px);line-height:1.1;margin-bottom:18px}
  .section-head p{color:var(--chocolate-soft);font-size:17px}

  /* STORY */
  .story{background:var(--cream-soft)}
  .story-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
  .story-img{position:relative;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/5}
  .story-img img{width:100%;height:100%;object-fit:cover}
  .story-img::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 50%,rgba(62,42,31,.2));
  }
  .story-text h2{font-size:clamp(36px,4vw,52px);line-height:1.1;margin-bottom:24px}
  .story-text .lead{font-family:'Playfair Display',serif;font-style:italic;font-size:20px;color:var(--chocolate);margin-bottom:24px;line-height:1.5}
  .story-text p{color:var(--chocolate-soft);margin-bottom:18px;font-size:16px}
  .story-signature{
    margin-top:32px;padding-top:24px;border-top:1px solid rgba(62,42,31,.1);
    display:flex;align-items:center;gap:16px;
  }
  .story-signature .avatar{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold-soft));
    display:flex;align-items:center;justify-content:center;
    color:var(--milk);font-family:'Playfair Display',serif;font-size:22px;font-weight:700;
  }
  .story-signature .name{font-weight:600;color:var(--chocolate)}
  .story-signature .role{font-size:13px;color:var(--muted)}

  /* MENU */
  .menu-tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:56px}
  .tab{
    padding:12px 24px;border-radius:999px;
    background:transparent;border:1px solid rgba(62,42,31,.15);
    color:var(--chocolate-soft);font-size:14px;font-weight:500;
    cursor:pointer;transition:all .3s;
  }
  .tab:hover{border-color:var(--gold);color:var(--chocolate)}
  .tab.active{background:var(--chocolate);color:var(--milk);border-color:var(--chocolate)}

  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
  .menu-card{
    background:var(--milk);border-radius:20px;overflow:hidden;
    box-shadow:0 4px 20px rgba(62,42,31,.05);
    transition:all .4s ease;
    border:1px solid rgba(62,42,31,.04);
  }
  .menu-card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(62,42,31,.12)}
  .menu-card-img{aspect-ratio:4/3;overflow:hidden;background:var(--cream-soft)}
  .menu-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .menu-card:hover .menu-card-img img{transform:scale(1.06)}
  .menu-card-body{padding:22px}
  .menu-card-body h3{font-size:18px;margin-bottom:6px;font-weight:700}
  .menu-card-body .desc{font-size:13px;color:var(--muted);margin-bottom:16px;min-height:36px}
  .menu-card-foot{display:flex;align-items:center;justify-content:space-between}
  .price{font-family:'Playfair Display',serif;font-size:22px;color:var(--chocolate);font-weight:700}
  .add-btn{
    width:38px;height:38px;border-radius:50%;
    background:var(--cream);color:var(--chocolate);
    border:none;cursor:pointer;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s;
  }
  .add-btn:hover{background:var(--gold);color:var(--milk);transform:rotate(90deg)}

  /* GALLERY */
  .gallery{background:var(--cream-soft)}
  .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .gallery-item{border-radius:18px;overflow:hidden;position:relative;cursor:pointer;aspect-ratio:1/1}
  .gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .gallery-item:hover img{transform:scale(1.08)}
  .gallery-item::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 60%,rgba(62,42,31,.4));
    opacity:0;transition:opacity .3s;
  }
  .gallery-item:hover::after{opacity:1}

  /* REVIEWS */
  .reviews-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  .review-card{
    background:var(--milk);padding:32px;border-radius:20px;
    border:1px solid rgba(62,42,31,.06);
    transition:all .3s;
  }
  .review-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .stars{color:var(--gold);margin-bottom:16px;font-size:16px;letter-spacing:2px}
  .review-text{font-family:'Playfair Display',serif;font-style:italic;color:var(--chocolate);font-size:17px;line-height:1.6;margin-bottom:24px}
  .review-author{display:flex;align-items:center;gap:12px}
  .review-avatar{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,var(--green-soft),var(--green));
    color:var(--milk);display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:15px;
  }
  .review-name{font-weight:600;color:var(--chocolate);font-size:14px}
  .review-date{font-size:12px;color:var(--muted)}

  /* NEWSLETTER */
  .newsletter{
    background:linear-gradient(135deg,var(--chocolate) 0%,#2A1F17 100%);
    color:var(--milk);
    border-radius:32px;
    padding:80px 60px;
    margin:0 28px;
    text-align:center;
    position:relative;overflow:hidden;
  }
  .newsletter::before{content:"☀️";position:absolute;top:40px;right:60px;font-size:120px;opacity:.08}
  .newsletter::after{content:"🥐";position:absolute;bottom:40px;left:60px;font-size:100px;opacity:.08}
  .newsletter h2{color:var(--milk);font-size:clamp(32px,4vw,48px);margin-bottom:16px}
  .newsletter p{color:rgba(255,251,245,.7);max-width:520px;margin:0 auto 32px;font-size:16px}
  .newsletter-form{
    display:flex;gap:10px;max-width:480px;margin:0 auto;
    background:rgba(255,251,245,.1);padding:6px;border-radius:999px;
    border:1px solid rgba(255,251,245,.15);
  }
  .newsletter-form input{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--milk);padding:12px 20px;font-size:15px;font-family:inherit;
  }
  .newsletter-form input::placeholder{color:rgba(255,251,245,.5)}
  .newsletter-form button{
    background:var(--gold);color:var(--chocolate);
    border:none;padding:12px 28px;border-radius:999px;
    font-weight:600;cursor:pointer;transition:all .3s;font-family:inherit;
  }
  .newsletter-form button:hover{background:var(--gold-soft)}
  .newsletter-note{font-size:13px;color:rgba(255,251,245,.5);margin-top:16px}

  /* CONTACT */
  .contact-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:60px;align-items:start}
  .contact-info h2{font-size:clamp(32px,4vw,48px);margin-bottom:16px;line-height:1.1}
  .contact-info > p{color:var(--chocolate-soft);margin-bottom:36px}
  .contact-list{display:flex;flex-direction:column;gap:20px}
  .contact-item{
    display:flex;gap:18px;align-items:flex-start;
    padding:20px;border-radius:16px;
    background:var(--cream-soft);transition:all .3s;
  }
  .contact-item:hover{background:var(--cream);transform:translateX(4px)}
  .contact-icon{
    width:48px;height:48px;border-radius:12px;flex-shrink:0;
    background:var(--milk);color:var(--chocolate);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(62,42,31,.06);
  }
  .contact-icon svg{width:22px;height:22px}
  .contact-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
  .contact-value{color:var(--chocolate);font-weight:500;font-size:15px}
  .contact-value a{transition:color .2s}
  .contact-value a:hover{color:var(--gold)}

  .contact-map{
    border-radius:24px;overflow:hidden;
    box-shadow:var(--shadow);
    aspect-ratio:1/1;
    border:1px solid rgba(62,42,31,.06);
  }
  .contact-map iframe{width:100%;height:100%;border:0;display:block;filter:sepia(15%) saturate(90%) brightness(98%)}

  /* FOOTER */
  footer{background:var(--chocolate);color:rgba(255,251,245,.7);padding:60px 0 30px;margin-top:80px}
  .footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
  .footer-brand .logo{color:var(--milk);margin-bottom:16px}
  .footer-brand p{font-size:14px;max-width:320px;line-height:1.7}
  .footer-col h4{color:var(--milk);font-size:15px;margin-bottom:18px;font-family:'Inter',sans-serif;font-weight:600}
  .footer-col ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .footer-col a{font-size:14px;transition:color .2s}
  .footer-col a:hover{color:var(--gold)}
  .footer-bottom{
    padding-top:24px;border-top:1px solid rgba(255,251,245,.1);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
    font-size:13px;
  }
  .socials{display:flex;gap:10px}
  .socials a{
    width:36px;height:36px;border-radius:50%;
    background:rgba(255,251,245,.08);
    display:flex;align-items:center;justify-content:center;
    transition:all .3s;
  }
  .socials a:hover{background:var(--gold);color:var(--chocolate)}
  .socials svg{width:16px;height:16px}

  .fade-up{opacity:0;transform:translateY(30px);transition:all .8s ease}
  .fade-up.in{opacity:1;transform:translateY(0)}

  @media (max-width:960px){
    .hero-grid,.story-grid,.contact-grid{grid-template-columns:1fr;gap:40px}
    .hero-visual{height:480px;order:-1}
    .hero h1 .line2{padding-left:0}
    .hero h1 .line2::before{display:none}
    .hero-side-label{display:none}
    .gallery-grid{grid-template-columns:repeat(2,1fr)}
    .reviews-grid{grid-template-columns:1fr}
    .footer-grid{grid-template-columns:1fr 1fr;gap:30px}
    .newsletter{padding:50px 28px}
    section{padding:80px 0}
    .hero-ornament-top{top:110px}
    .hero-stat{padding:0 16px}
  }
  @media (max-width:640px){
    .nav-links{display:none}
    .menu-toggle{display:flex}
    .hero-stats{flex-wrap:wrap}
    .hero-stat{flex-basis:50%;padding:12px 0}
    .hero-stat:nth-child(2)::before{display:none}
    .stat-num{font-size:30px}
    .footer-grid{grid-template-columns:1fr}
    .footer-bottom{flex-direction:column;text-align:center}
    .newsletter-form{flex-direction:column;border-radius:20px;background:transparent;padding:0;border:none;gap:12px}
    .newsletter-form input{background:rgba(255,251,245,.1);border-radius:999px;border:1px solid rgba(255,251,245,.15)}
    .hero-sun{width:64px;height:64px;font-size:22px;top:20px}
    .hero-tag-card{right:0;bottom:10px;padding:12px 16px}
    .scroll-indicator{display:none}
  }
</style>
